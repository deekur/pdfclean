name: build-windows

# 触发方式：推送到 main 自动构建，或在 Actions 页面手动 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备 qpdf（Windows 64 位）
        shell: pwsh
        run: |
          if (Test-Path "tools\qpdf.exe") {
            Write-Host "tools/ 已内置 qpdf，跳过下载"
          } else {
            $url = "https://sourceforge.net/projects/qpdf/files/qpdf/12.4.2/qpdf-12.4.2-msvc64.zip/download"
            Invoke-WebRequest -Uri $url -OutFile qpdf.zip -UseBasicParsing
            Expand-Archive qpdf.zip -DestinationPath qpdf_tmp
            New-Item -ItemType Directory -Force -Path tools | Out-Null
            Copy-Item "qpdf_tmp\qpdf-12.4.2-msvc64\bin\*" tools\ -Recurse
          }
          Get-ChildItem tools | Select-Object Name, Length

      - name: 冒烟测试
        shell: pwsh
        # 全部输出用 ASCII：Windows 控制台默认 cp1252，打印中文会 UnicodeEncodeError
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "import pypdf, cryptography; print('pypdf', pypdf.__version__, '| cryptography', cryptography.__version__)"
          # 精简版不打包 pymupdf，断言它确实没被引入
          python -c "import importlib.util as u; assert u.find_spec('pymupdf') is None, 'pymupdf should not be installed'; print('pymupdf: not installed (expected)')"
          # _find_qpdf 必须能定位到随包 qpdf，否则打出来的 exe 会失去去线性化/解密能力
          python -c "import pdfstrip, os, sys; p = pdfstrip._find_qpdf(); print('qpdf ->', p); sys.exit(0 if p and os.path.isfile(p) else 1)"
          # AES 解密能力自检：cryptography 缺失时这里就会失败，比压整份文件更早暴露
          python -c "from pypdf._crypt_providers import crypt_provider; print('crypt provider:', crypt_provider); assert crypt_provider[0] != 'fallback', 'cryptography missing'"
          # 用 qpdf 从一个最小 PDF 生成合法测试件（手写 startxref 容易被 pypdf 拒绝）
          python -c "open('mini.pdf','wb').write(b'%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</ProcSet[/PDF]>>>>endobj\ntrailer<</Root 1 0 R/Size 4>>\nstartxref\n0\n%%EOF\n')"
          python -c "import subprocess, os; q=os.path.join('tools','qpdf.exe'); subprocess.run([q,'--warning-exit-0','--object-streams=disable','mini.pdf','smoke.pdf'],check=True)"
          python pdfstrip.py smoke.pdf -o smoke_out.pdf
          python -c "import os; a, b = os.path.getsize('smoke.pdf'), os.path.getsize('smoke_out.pdf'); print('smoke', a, '->', b); assert b > 0"
          # 关键回归 1：加密 + 线性化 文件必须能被 qpdf 解开并压掉
          python -c "import subprocess, os; q=os.path.join('tools','qpdf.exe'); subprocess.run([q,'--encrypt','','123456','256','--','--linearize','smoke.pdf','smoke_enc.pdf'],check=True)"
          python pdfstrip.py smoke_enc.pdf -o smoke_enc_out.pdf -p 123456
          python -c "import os; s=os.path.getsize('smoke_enc_out.pdf'); print('enc smoke ->', s); assert s > 0"
          # 关键回归 2：压出来的文件不能再是加密的
          python -c "from pypdf import PdfReader; r=PdfReader('smoke_enc_out.pdf'); assert not r.is_encrypted, 'output still encrypted'; print('output decrypted: ok,', len(r.pages), 'page(s)')"
          # 关键回归 3：错口令必须报错退出，而不是静默产出文件
          python -c "import subprocess, sys, os; r=subprocess.run([sys.executable,'pdfstrip.py','smoke_enc.pdf','-o','x.pdf','-p','wrong'],capture_output=True,text=True); print('wrong password exit code:', r.returncode); assert r.returncode != 0 and not os.path.exists('x.pdf'), 'wrong password must fail without output'"
          # 拖放依赖自检：gui.py 用 ctypes 接 WM_DROPFILES，缺 wintypes 会导致拖入失效
          python -c "import ctypes, ctypes.wintypes; print('ctypes.wintypes ok')"
          python -c "import gui, sys; print('_DND_OK =', gui._DND_OK); sys.exit(0 if gui._DND_OK else 1)"
          # 递归收集自检：造 2 层目录 + 一个假产物 + 一个非 PDF，断言只收 3 个
          python ci_check_recursive.py
          # GUI 环境自检：打包后 stdout/stderr 为 None，裸 write 会 AttributeError。
          # 这条防的是「口令错误」被变成未捕获异常的回归。
          python ci_check_gui_env.py
          # 子进程静默自检：Windows 上必须带 CREATE_NO_WINDOW，否则每压一个文件闪一次黑窗
          python -c "import pdfstrip, sys; kw = pdfstrip._SUBPROCESS_KW; print('subprocess kw:', sorted(kw)); assert 'creationflags' in kw, 'CREATE_NO_WINDOW missing'; assert kw['creationflags'] == 0x08000000, 'wrong flag'; assert 'startupinfo' in kw, 'startupinfo missing'"

      - name: 打包
        run: pyinstaller build.spec --noconfirm

      - name: 检查产物
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist")) { throw "dist 目录不存在" }
          Get-ChildItem dist | Select-Object Name, Length
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "没有生成 exe" }
          Write-Host ("exe: {0}  {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB))

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-compress-windows-x64
          path: dist/*.exe
          if-no-files-found: error

