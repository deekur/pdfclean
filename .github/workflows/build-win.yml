name: build-windows

# 触发方式：推送到 main 自动构建，或在 Actions 页面手动 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备 qpdf（Windows 64 位）
        shell: pwsh
        run: |
          if (Test-Path "tools\qpdf.exe") {
            Write-Host "tools/ 已内置 qpdf，跳过下载"
          } else {
            $url = "https://sourceforge.net/projects/qpdf/files/qpdf/12.4.2/qpdf-12.4.2-msvc64.zip/download"
            Invoke-WebRequest -Uri $url -OutFile qpdf.zip -UseBasicParsing
            Expand-Archive qpdf.zip -DestinationPath qpdf_tmp
            New-Item -ItemType Directory -Force -Path tools | Out-Null
            Copy-Item "qpdf_tmp\qpdf-12.4.2-msvc64\bin\*" tools\ -Recurse
          }
          Get-ChildItem tools | Select-Object Name, Length

      - name: 冒烟测试
        shell: pwsh
        run: |
          python -c "import pypdf; print('pypdf', pypdf.__version__)"
          # 精简版不打包 pymupdf，这里断言它确实没被引入
          python -c "import importlib.util as u; assert u.find_spec('pymupdf') is None, '精简版不应安装 pymupdf'; print('pymupdf 未安装（符合预期）')"
          # _find_qpdf 必须能定位到随包 qpdf，否则打出来的 exe 会失去去线性化/解密能力
          python -c "import pdfstrip, os, sys; p = pdfstrip._find_qpdf(); print('qpdf ->', p); sys.exit(0 if p and os.path.isfile(p) else 1)"
          # 用 qpdf 从一个最小 PDF 生成合法测试件（qpdf 会重算 xref 偏移；手写 startxref 容易错，pypdf 会拒绝加载）
          python -c "open('mini.pdf','wb').write(b'%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]>>endobj\ntrailer<</Root 1 0 R/Size 4>>\nstartxref\n0\n%%EOF\n')"
          python -c "import subprocess, os; q=os.path.join('tools','qpdf.exe'); subprocess.run([q,'--warning-exit-0','mini.pdf','smoke.pdf'],check=True)"
          python pdfstrip.py smoke.pdf -o smoke_out.pdf
          python -c "import os; a, b = os.path.getsize('smoke.pdf'), os.path.getsize('smoke_out.pdf'); print('smoke', a, '->', b); assert b > 0"
          # 关键回归：加密 + 线性化 文件必须能被 qpdf 解开并压掉
          python -c "import subprocess, os; q=os.path.join('tools','qpdf.exe'); subprocess.run([q,'--encrypt','','123456','256','--','--linearize','smoke.pdf','smoke_enc.pdf'],check=True)"
          python pdfstrip.py smoke_enc.pdf -o smoke_enc_out.pdf -p 123456
          python -c "import os; s=os.path.getsize('smoke_enc_out.pdf'); print('enc smoke ->', s); assert s > 0"
          # 错口令必须报错退出，而不是静默产出损坏文件
          python -c "import subprocess, sys; r=subprocess.run([sys.executable,'pdfstrip.py','smoke_enc.pdf','-o','x.pdf','-p','wrong'],capture_output=True,text=True); print('错口令退出码', r.returncode); assert r.returncode != 0 and not __import__('os').path.exists('x.pdf')"

      - name: 打包
        run: pyinstaller build.spec --noconfirm

      - name: 检查产物
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist")) { throw "dist 目录不存在" }
          Get-ChildItem dist | Select-Object Name, Length
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "没有生成 exe" }
          Write-Host ("exe: {0}  {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB))

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-compress-windows-x64
          path: dist/*.exe
          if-no-files-found: error

